spring.application.name=SistemaEspecialista
server.port=${PORT:8080}
server.forward-headers-strategy=none
server.http2.enabled=false
server.max-http-request-header-size=8KB
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=5s
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2
spring.servlet.multipart.enabled=false
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false
spring.web.error.whitelabel.enabled=false
