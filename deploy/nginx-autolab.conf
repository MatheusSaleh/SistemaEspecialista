# Carregue este arquivo dentro do bloco http do Nginx.
# Troque o domínio e os caminhos do certificado pelos da VPS.
limit_req_zone $binary_remote_addr zone=autolab_requisicoes:10m rate=8r/s;
limit_req_zone $server_name zone=autolab_requisicoes_total:1m rate=24r/s;
limit_conn_zone $binary_remote_addr zone=autolab_conexoes:10m;

upstream autolab_socket {
    server unix:/var/lib/autolab/run/autolab.sock;
}

server {
    listen 443 ssl;
    server_name autolab.seu-dominio.example;

    ssl_certificate /etc/letsencrypt/live/autolab.seu-dominio.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autolab.seu-dominio.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 5s;
    limit_req zone=autolab_requisicoes burst=20 nodelay;
    limit_req zone=autolab_requisicoes_total burst=32 nodelay;
    limit_req_status 429;
    limit_conn autolab_conexoes 12;
    limit_conn_status 429;

    location / {
        proxy_pass http://autolab_socket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_request_buffering on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }
}
